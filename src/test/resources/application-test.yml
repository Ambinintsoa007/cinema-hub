spring:
  config:
    activate:
      on-profile: test

  datasource:
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true
    locations:
      - classpath:db/migration
      - classpath:testdata

app:
  jwt:
    secret: test-secret-key-that-is-long-enough-for-jwt-tests
    expiration-seconds: 3600

  initial-manager:
    enabled: false